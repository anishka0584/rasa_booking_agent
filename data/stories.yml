version: "3.1"

stories:

- story: hotel booking - greet first
  steps:
    - intent: greet
    - action: utter_greet
    - intent: book_hotel
    - action: action_store_initial_message
    - action: hotel_booking_form
    - active_loop: hotel_booking_form
    - active_loop: null
    - action: utter_booking_confirmation

- story: hotel booking - direct booking
  steps:
    - intent: book_hotel
    - action: action_store_initial_message
    - action: hotel_booking_form
    - active_loop: hotel_booking_form
    - active_loop: null
    - action: utter_booking_confirmation

- story: hotel booking with city prefilled
  steps:
    - intent: book_hotel
      entities:
        - city: "bangalore"
    - action: action_store_initial_message
    - action: hotel_booking_form
    - active_loop: hotel_booking_form
    - active_loop: null
    - action: utter_booking_confirmation

- story: hotel booking with city and guests prefilled
  steps:
    - intent: book_hotel
      entities:
        - city: "mumbai"
        - number: 3
    - action: action_store_initial_message
    - action: hotel_booking_form
    - active_loop: hotel_booking_form
    - active_loop: null
    - action: utter_booking_confirmation

- story: hotel booking with all details
  steps:
    - intent: book_hotel
      entities:
        - city: "delhi"
        - date: "tomorrow"
        - date: "15 feb"
        - number: 2
    - action: action_store_initial_message
    - action: hotel_booking_form
    - active_loop: hotel_booking_form
    - active_loop: null
    - action: utter_booking_confirmation

- story: hotel booking with dates and city
  steps:
    - intent: book_hotel
      entities:
        - city: "goa"
        - date: "10 may"
        - date: "15 may"
    - action: action_store_initial_message
    - action: hotel_booking_form
    - active_loop: hotel_booking_form
    - active_loop: null
    - action: utter_booking_confirmation

- story: hotel booking then goodbye
  steps:
    - intent: book_hotel
    - action: action_store_initial_message
    - action: hotel_booking_form
    - active_loop: hotel_booking_form
    - active_loop: null
    - action: utter_booking_confirmation
    - intent: goodbye
    - action: utter_goodbye

- story: greet then goodbye
  steps:
    - intent: greet
    - action: utter_greet
    - intent: goodbye
    - action: utter_goodbye

- story: hotel booking interrupted by greet
  steps:
    - intent: book_hotel
    - action: action_store_initial_message
    - action: hotel_booking_form
    - active_loop: hotel_booking_form
    - intent: greet
    - action: utter_greet
    - action: hotel_booking_form
    - active_loop: null
    - action: utter_booking_confirmation

- story: provide city during form
  steps:
    - intent: book_hotel
    - action: action_store_initial_message
    - action: hotel_booking_form
    - active_loop: hotel_booking_form
    - slot_was_set:
      - requested_slot: city
    - intent: inform
      entities:
        - city: "bangalore"
    - action: hotel_booking_form
    - active_loop: null
    - action: utter_booking_confirmation

- story: provide dates during form
  steps:
    - intent: book_hotel
    - action: action_store_initial_message
    - action: hotel_booking_form
    - active_loop: hotel_booking_form
    - slot_was_set:
      - requested_slot: check_in_date
    - intent: inform
    - action: hotel_booking_form
    - slot_was_set:
      - requested_slot: check_out_date
    - intent: inform
    - action: hotel_booking_form
    - active_loop: null
    - action: utter_booking_confirmation

- story: provide number of guests during form
  steps:
    - intent: book_hotel
    - action: action_store_initial_message
    - action: hotel_booking_form
    - active_loop: hotel_booking_form
    - slot_was_set:
      - requested_slot: number_of_guests
    - intent: inform
      entities:
        - number: 2
    - action: hotel_booking_form
    - active_loop: null
    - action: utter_booking_confirmation

# New story for handling invalid input that should NOT fill slots
- story: invalid date input should not affect other slots
  steps:
    - intent: book_hotel
    - action: action_store_initial_message
    - action: hotel_booking_form
    - active_loop: hotel_booking_form
    - slot_was_set:
      - requested_slot: city
    - intent: inform
      entities:
        - city: "bangalore"
    - action: hotel_booking_form
    - slot_was_set:
      - requested_slot: check_in_date
    - intent: inform  # User enters invalid input like "5555"
    - action: hotel_booking_form  # Form rejects and asks again
    - slot_was_set:
      - requested_slot: check_in_date  # Still asking for same slot
    - intent: inform
    - action: hotel_booking_form
    - active_loop: null
    - action: utter_booking_confirmation